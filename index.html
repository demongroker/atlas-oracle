<title>Atlas the All-Mighty Oracle</title>
<meta name="description" content="Ask Atlas, the all-knowing cosmic oracle, any question and receive a prophecy.">
<meta property="og:title" content="Atlas the All-Mighty Oracle"><meta property="og:description" content="Ask the cosmic oracle anything."><meta property="og:type" content="website"><meta property="og:url" content="https://demongroker.github.io/atlas-oracle/"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#07040f">

<style>
:root{--fg:#f5efdc;--mut:rgba(226,214,255,.65);--gold:#f1cf72;--gold2:#c9962f;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.08);--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#07040f;color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.7}
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:m 30s ease-in-out infinite alternate}
.blob:nth-child(1){width:70vmax;height:70vmax;background:#5a22c9;left:-30vmax;top:-25vmax}
.blob:nth-child(2){width:50vmax;height:50vmax;background:#c2861f;right:-25vmax;top:25vh;opacity:.32;animation-duration:36s;animation-delay:-10s}
.blob:nth-child(3){width:55vmax;height:55vmax;background:#2a3cff;left:-10vmax;bottom:-30vmax;opacity:.38;animation-duration:42s;animation-delay:-18s}
@keyframes m{to{transform:translate(6vmax,8vmax) scale(1.12)}}
main{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:calc(var(--s6) + env(safe-area-inset-top)) var(--s4) var(--s6);text-align:center}
.portrait{width:148px;height:148px;flex:none;aspect-ratio:1;margin:0 auto var(--s4);border-radius:50%;position:relative;padding:3px;background:conic-gradient(from 0deg,var(--gold),#fff3c9,var(--gold2),#8a5cff,var(--gold));animation:rot 12s linear infinite}
.portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid #07040f;animation:rot 12s linear infinite reverse}
.portrait:before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(241,207,114,.35),transparent 70%);z-index:-1;animation:halo 5s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes halo{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
h1{font:600 2.4rem/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.18em;padding-left:.18em;text-transform:uppercase;background:linear-gradient(180deg,#fff7dc,var(--gold) 60%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:var(--s2) 0 var(--s5);font-size:.9rem;letter-spacing:.02em}
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:24px;padding:var(--s5);margin:0 0 var(--s3);box-shadow:0 24px 60px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);text-align:left}
form{display:flex;flex-direction:column;gap:var(--s3)}
input{width:100%;min-height:52px;padding:0 var(--s4);border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:16px;outline:none;transition:border-color .25s,box-shadow .25s}
input::placeholder{color:rgba(226,214,255,.45)}
input:focus{border-color:rgba(241,207,114,.6);box-shadow:0 0 0 4px rgba(241,207,114,.12)}
button{min-height:52px;width:100%;border:0;border-radius:16px;font-family:inherit;font-weight:600;font-size:17px;letter-spacing:.02em;color:#241600;background:linear-gradient(135deg,#ffe7a3,var(--gold) 45%,var(--gold2));box-shadow:0 10px 28px -10px rgba(241,190,80,.7),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;transition:transform .2s,filter .2s}
button:active{transform:scale(.98)}button:hover{filter:brightness(1.05)}button:disabled{opacity:.55}
#answer{min-height:0;font-size:1.08rem;line-height:1.55}
#answer .q{color:var(--mut);font-size:.88rem;margin-bottom:var(--s2)}
.idle{color:var(--mut);font-style:italic;text-align:center;display:block}
.consult{text-align:center;color:var(--gold);animation:flick 1.4s infinite;font-size:.95rem}
.orb{width:48px;height:48px;margin:0 auto var(--s3);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,var(--gold) 35%,#6b2fd6 75%,transparent 76%);box-shadow:0 0 30px rgba(241,207,114,.5);animation:spin 1.2s linear infinite,halo 1.2s infinite}
@keyframes spin{to{filter:hue-rotate(360deg)}}@keyframes flick{50%{opacity:.55}}
.cursor{display:inline-block;width:2px;height:1em;background:var(--gold);vertical-align:-2px;margin-left:2px;animation:flick .7s infinite}
h2{display:flex;align-items:center;gap:var(--s2);font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 var(--s3)}
#pdate{font-size:.8rem;color:var(--mut);margin-bottom:var(--s2)}
#prophecy{font:italic 1.1rem/1.5 Georgia,serif;color:#fff4d6}
ul{list-style:none;padding:0;margin:0}li{padding:var(--s3) 0;border-top:1px solid var(--line2);font-size:.9rem;color:rgba(245,239,220,.85)}li:first-child{border-top:0;padding-top:0}li:last-child{padding-bottom:0}li b{display:block;color:#fff;font-weight:600;margin-bottom:2px}
footer{font-size:.75rem;color:rgba(226,214,255,.4);margin-top:var(--s5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
