<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas the All-Mighty Oracle</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f3e9c6;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 30% 20%,#3b1a6b 0%,#160a35 45%,#05030f 100%);overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:0}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:28px 18px 40px;text-align:center}
.portrait{width:170px;height:170px;margin:6px auto 14px;border-radius:50%;position:relative}
.portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #e8c25a;position:relative;z-index:2}
.portrait:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,100,.75) 40%,rgba(255,200,60,0) 72%);animation:halo 2.6s ease-in-out infinite;z-index:1}
@keyframes halo{0%,100%{transform:scale(.95);opacity:.65}50%{transform:scale(1.12);opacity:1}}
h1{font-size:2.1rem;margin:4px 0 2px;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#f7dc8a,#fff6d6,#d9a93a);-webkit-background-clip:text;color:transparent;text-shadow:0 0 24px rgba(240,200,90,.35)}
.sub{font-style:italic;color:#c8b6f0;margin:0 0 20px;font-size:.95rem}
.card{background:rgba(20,10,50,.62);border:1px solid rgba(232,194,90,.45);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 0 30px rgba(120,70,220,.25);backdrop-filter:blur(4px)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #8b6fd8;background:rgba(5,3,20,.7);color:#fff;font:1rem Georgia,serif;outline:none}
input:focus{border-color:#e8c25a;box-shadow:0 0 12px rgba(232,194,90,.5)}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;font:bold 1.05rem Georgia,serif;letter-spacing:1px;color:#2a1600;background:linear-gradient(135deg,#ffe08a,#d39b25);box-shadow:0 0 18px rgba(240,190,60,.55);cursor:pointer}
button:disabled{opacity:.6}
#answer{min-height:90px;font-size:1.12rem;line-height:1.5;text-align:left}
#answer .q{color:#b9a6ee;font-size:.9rem;font-style:italic;margin-bottom:8px}
.consult{text-align:center;color:#ffe08a;animation:flick 1s infinite}
.orb{width:54px;height:54px;margin:6px auto;border-radius:50%;background:radial-gradient(circle,#fff6d6,#e8c25a 40%,#6b2fd6 75%,transparent);animation:spin 1s linear infinite,halo 1s infinite}
@keyframes spin{to{filter:hue-rotate(360deg)}}@keyframes flick{50%{opacity:.55}}
.cursor{display:inline-block;width:2px;height:1em;background:#ffe08a;vertical-align:-2px;animation:flick .7s infinite}
h2{font-size:1rem;letter-spacing:3px;text-transform:uppercase;color:#e8c25a;margin:0 0 8px}
#prophecy{font-style:italic;line-height:1.5}
ul{list-style:none;padding:0;margin:0;text-align:left}li{padding:7px 0;border-bottom:1px dashed rgba(232,194,90,.25);font-size:.9rem}li b{color:#c8b6f0;font-weight:normal}
footer{font-size:.75rem;color:#8d7fb8;margin-top:18px}
